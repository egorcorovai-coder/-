name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: sh ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-position-1.21.4
          path: build/libs/cursor-position-1.0.1.jar
          if-no-files-found: error
